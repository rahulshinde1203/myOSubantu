[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-server-os"
version = "0.1.0"
description = "Hardened Ubuntu Server OS Workstation Control Panel"
readme = "UBUNTU_SERVER_OS_SPECIFICATION.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "argon2-cffi>=23.1.0",
    "psutil>=5.9.8",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.9.0",
    "black>=24.2.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
