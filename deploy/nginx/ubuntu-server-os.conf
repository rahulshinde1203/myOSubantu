# Ubuntu Server OS — Hardened Nginx Production Reverse Proxy Configuration
# SSL Labs A+ Profile, Strict Security Headers, and Upstream Socket Forwarding

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream Flask Application via Gunicorn Unix Domain Socket
upstream ubuntu_os_backend {
    server unix:/run/ubuntu-server-os/ubuntu-os.sock fail_timeout=0;
}

# Upstream Terminal WebSocket Gateway
upstream ubuntu_term_gateway {
    server 127.0.0.1:8765;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS Certificates (configured during automated provisioning)
    ssl_certificate /etc/ssl/certs/ubuntu-server-os.crt;
    ssl_certificate_key /etc/ssl/private/ubuntu-server-os.key;

    # Modern TLS 1.3 / 1.2 Configuration (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Production Hardened Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'none';" always;

    # Root Directory for Web Application UI
    root /var/www/ubuntu-server-os/client;
    index index.html;

    # Static Assets with aggressive caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Authentication Rate Limiting
    location /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://ubuntu_os_backend;
        include proxy_params;
    }

    # REST API Gateway
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://ubuntu_os_backend;
        include proxy_params;
    }

    # Terminal WebSocket Gateway
    location /ws/v1/terminal {
        proxy_pass http://ubuntu_term_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Default fallback to macOS Workstation Shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
